# the following parameters are the same across the project and might be needed in more than one module #
root_dir: "/sc-snap-parse/" # Absolute path to the main dir of the project where GitHub repo lives
data_dir: "/sc-snap-parse/analyses/parseq-alignment/results/" # Absolute path to metadata dir of the project.  
metadata_dir: "/sc-snap-parse/data/project_metadata" # Absolute path to metadata dir of the project. 
metadata_file: "sample_metadata.tsv" # Options: "sample_metadata.tsv" (default) or name as user wants. It needs to be in `tsv` format. It can include one or more samples, as long as it contains at least the following column: `ID`. The `ID` column must contain unique values. Additional metadata columns can be added and arranged as needed by the user (though not required).
genome_name: "GRCm39" # define genome reference and versioning. Options: (1) mouse: "GRCm39" and "mm10".
