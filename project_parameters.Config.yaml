CONTACT_EMAIL: "sharon.freshour@stjude.org"
PIPELINE: "Standard sc-/sn-RNA-Seq Analysis in PARSE BIOSCIENCES sequencing technology"
START_DATE: "06/02/2026"
COMPLETION_DATE: "ONGOING"

# the following parameters are set up as default values and/or are specific for the following modules: 

# `./analyses/fastqc-analysis`

# Name of the metadata file (TSV format).
# Default: "sublibrary_metadata.tsv". Users can provide a custom filename if desired.
#
# Requirements:
# - File must be in tab-separated (TSV) format.
# - Must contain at least the following columns, in this exact order:
#     1. ID. The `ID` column must contain unique identifiers for each row.
#     2. SAMPLE
#     3. FASTQ
#
# Additional notes:
# - Additional metadata columns are optional and can be included in any order after the required columns.
# - FASTQ file paths are expected to match patterns such as: `path1/*R1*.fastq.gz`
# - Paths are resolved relative to the `metadata_dir`.
metadata_file_fastqc_module: "sublibrary_metadata.tsv"

